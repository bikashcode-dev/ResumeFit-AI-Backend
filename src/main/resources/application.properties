spring.application.name=resume-tailor-backend
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=22MB
spring.servlet.multipart.max-request-size=22MB
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.url=https://api.openai.com/v1/chat/completions
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models
ai.openrouter.api-key=${OPENROUTER_API_KEY:}
ai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
ai.openrouter.url=${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
ai.local.enabled=${LOCAL_AI_ENABLED:false}
ai.local.url=${LOCAL_AI_URL:http://localhost:11434}